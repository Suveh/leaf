spring.application.name=backend

spring.datasource.url=jdbc:h2:mem:leafdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.chat.options.max-output-tokens=1000
spring.ai.google.genai.chat.options.thinking-level=MINIMAL
